services:
  postgres:
    image: postgres:17-alpine

    container_name: spacechat-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tcpchat}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    container_name: spacechat-server

    build: 
      context: .
      dockerfile: Dockerfile

    environment:
      Database__Host: postgres
      Database__Port: "5432"
      Database__Database: ${POSTGRES_DB:-tcpchat}
      Database__Username: ${POSTGRES_USER:-postgres}
      Database__Password: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

    ports:
      - "8000:8000"
      
    depends_on:
      - postgres

volumes:
  postgres_data:
